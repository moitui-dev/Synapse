<!-- Add this inside your <main class="dashboard-grid"> -->
<section class="card git-card">
    <h2>GitHub & Version Control</h2>
    <div class="git-status-bar">
        <span class="branch-indicator">🌿 Branch: <strong id="current-branch">main</strong></span>
        <span class="sync-status" id="sync-status">Up to date</span>
    </div>

    <div class="commit-log" id="commit-log">
        <!-- Populated dynamically via git-vault.js -->
    </div>

    <div class="git-actions">
        <button class="git-btn commit-btn" onclick="simulateGitAction('commit')">git commit</button>
        <button class="git-btn push-btn" onclick="simulateGitAction('push')">git push</button>
        <button class="git-btn pull-btn" onclick="simulateGitAction('pull')">git pull</button>
    </div>
</section>
