<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synapse Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Chart.js library for telemetry -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<header class="top-bar">
    <div class="logo">◈ SYNAPSE</div>
    <div id="live-clock">00:00:00</div>
</header>

<main class="dashboard-grid">
    <!-- Telemetry Card -->
    <section class="card telemetry-card">
        <h2>System Telemetry</h2>
        <canvas id="telemetryChart"></canvas>
    </section>

    <!-- Git & Version Control Card -->
    <section class="card git-card">
        <h2>GitHub & Version Control</h2>
        <div class="git-status-bar">
            <span class="branch-indicator">🌿 Branch: <strong id="current-branch">main</strong></span>
            <span class="sync-status" id="sync-status">Up to date</span>
        </div>
        <div class="commit-log" id="commit-log"></div>
        <div class="git-actions">
            <button class="git-btn commit-btn" onclick="simulateGitAction('commit')">git commit</button>
            <button class="git-btn push-btn" onclick="simulateGitAction('push')">git push</button>
            <button class="git-btn pull-btn" onclick="simulateGitAction('pull')">git pull</button>
        </div>
    </section>
</main>

<script src="js/telemetry.js"></script>
<script src="js/command.js"></script>
<script src="js/git-vault.js"></script>
<script src="js/app.js"></script>
</body>
</html>
